<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión — Mesas Disponibles</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
</head>

<body class="auth-page">

    <main class="auth-container">
        <div class="auth-card">
            <!-- Logo en círculo (más grande para Desktop) -->
            <div style="display: flex; justify-content: center; margin-bottom: 24px; margin-top: 8px;">
                <div style="width: 110px; height: 110px; border-radius: 50%; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #ffffff; border: 1px solid #e5e7eb; padding: 6px; box-shadow: 0 6px 16px rgba(0,0,0,0.06);">
                    <img src="assets/logo.jpeg" alt="Messapi" style="width: 100%; height: 100%; object-fit: contain; border-radius: 50%;">
                </div>
            </div>
            <p class="auth-subtitle">Panel de administración</p>

            <form id="login-form" novalidate>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required placeholder="admin1@test.com"
                        autocomplete="email" autofocus>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required placeholder="••••••••"
                        autocomplete="current-password">
                </div>

                <button type="submit" class="btn btn-primary btn-block" id="login-btn">
                    Iniciar sesión
                </button>

                <div id="form-error" class="form-error" hidden></div>
            </form>

            <p class="auth-footer">
                <a href="public.html">← Volver a la vista pública</a>
            </p>

                        <!-- Cartel de WhatsApp -->
            <div style="margin-top: 24px; text-align: center;">
                <a href="https://wa.me/5493434165613?text=Hola!%20Quiero%20sumar%20mi%20restaurante%20a%20Messapi" 
                   target="_blank" 
                   style="display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; background: #ecfdf5; border: 1px solid #a7f3d0; border-radius: 999px; text-decoration: none; color: #065f46; font-size: 0.85rem; font-weight: 600; transition: transform 0.2s, background 0.2s;"
                   onmouseover="this.style.background='#d1fae5'; this.style.transform='scale(1.02)';"
                   onmouseout="this.style.background='#ecfdf5'; this.style.transform='scale(1)';">
                    <!-- Icono de WhatsApp en SVG (liviano) -->
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="#25D366" xmlns="http://www.w3.org/2000/svg">
                        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
                    </svg>
                    ¿Querés sumar tu restaurante?
                </a>
            </div>
        </div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/utils/session.js"></script>
    <script src="js/utils/ui.js"></script>
    <script src="js/utils/guard.js"></script>
    <script src="js/services/client.js"></script>
    <script src="js/services/auth.js"></script>
    <script src="js/pages/login.js"></script>
</body>

</html>
