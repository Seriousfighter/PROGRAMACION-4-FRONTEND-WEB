<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Restaurantes disponibles</title>

    <link rel="stylesheet" href="main.css">
</head>

<body>

    <!-- ENCABEZADO -->
    <header class="encabezado">

        <div class="contenedor barra-superior">

            <div class="titulo-principal">
                <h1>Restaurantes disponibles</h1>

                <p>
                    Encontrá rápidamente un lugar disponible para comer.
                </p>
            </div>

            <!-- Acceso exclusivo para restaurantes -->
            <a href="login.html" class="btn-restaurante">
                Ingreso para restaurantes
            </a>

        </div>

    </header>


    <!-- CONTENIDO PRINCIPAL -->
    <main class="contenedor">

        <!-- FILTROS -->
        <section class="filtros">

            <!-- Buscar por nombre -->
            <input type="text" id="buscador" placeholder="Buscar restaurante...">

            <!-- Buscar por cantidad de personas -->
            <select id="personas">

                <option value="0">
                    Cantidad de personas
                </option>

                <option value="1">1 persona</option>
                <option value="2">2 personas</option>
                <option value="3">3 personas</option>
                <option value="4">4 personas</option>
                <option value="5">5 personas</option>
                <option value="6">6 personas</option>
                <option value="7">7 personas</option>
                <option value="8">8 personas</option>

            </select>

        </section>


        <!-- MENSAJES -->
        <section id="mensaje">
            <p>Cargando restaurantes...</p>
        </section>


        <!--
            Acá JavaScript carga automáticamente
            los restaurantes que vienen de la API.
        -->
        <section id="restaurantes" class="lista-restaurantes">
        </section>

    </main>


    <!-- JAVASCRIPT -->
    <script src="main.js"></script>

</body>

</html>
