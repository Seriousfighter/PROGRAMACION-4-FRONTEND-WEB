<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión — Mesas Disponibles</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
</head>

<body class="auth-page">

    <main class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">🍽️</div>
            <h1 class="auth-title">Messapi</h1>
            <p class="auth-subtitle">Panel de administración</p>

            <form id="login-form" novalidate>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required placeholder="admin1@test.com"
                        autocomplete="email" autofocus>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required placeholder="••••••••"
                        autocomplete="current-password">
                </div>

                <button type="submit" class="btn btn-primary btn-block" id="login-btn">
                    Iniciar sesión
                </button>

                <div id="form-error" class="form-error" hidden></div>
            </form>

            <p class="auth-switch">
                ¿No tenés cuenta? <a href="register.html">Registrate</a>
            </p>

            <p class="auth-footer">
                <a href="public.html">← Volver a la vista pública</a>
            </p>
        </div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/utils/session.js"></script>
    <script src="js/utils/ui.js"></script>
    <script src="js/utils/guard.js"></script>
    <script src="js/services/client.js"></script>
    <script src="js/services/auth.js"></script>
    <script src="js/pages/login.js"></script>
</body>

</html>
