<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Messapi | Encontrá tu restaurante</title>

    <link rel="stylesheet" href="main.css">
</head>

<body class="pagina-publica">

    <!-- ==========================================
         HEADER
    =========================================== -->

    <header class="publico-header">

        <div class="contenedor publico-header-contenido">

            <div class="publico-marca">

                <h1>Messapi</h1>

                <p>
                    Encontrá dónde comer sin dar vueltas.
                </p>

            </div>

            <a href="login.html" class="publico-login">
                Soy restaurante
            </a>

        </div>

    </header>


    <!-- ==========================================
         CONTENIDO PRINCIPAL
    =========================================== -->

    <main class="contenedor publico-contenido">


        <!-- PRESENTACIÓN -->

        <section class="publico-presentacion">

            <h2>¿Dónde comemos?</h2>

            <p>
                Buscá un restaurante y consultá rápidamente
                si tiene capacidad disponible.
            </p>

        </section>


        <!-- ==========================================
             BUSCADOR
        =========================================== -->

        <section class="publico-buscador">

            <div class="campo-busqueda">

                <span class="icono-busqueda">
                    🔎
                </span>

                <input type="text" id="buscador" placeholder="Buscar restaurante..." autocomplete="off">

            </div>

        </section>


        <!-- ==========================================
             MENSAJES
        =========================================== -->

        <section id="mensaje" class="publico-mensaje">

            <p>
                Cargando restaurantes...
            </p>

        </section>


        <!-- ==========================================
             RESULTADOS
        =========================================== -->

        <section class="publico-resultados">

            <div class="publico-resultados-titulo">

                <h2>
                    Restaurantes
                </h2>

                <p id="cantidad-resultados">
                </p>

            </div>


            <!--
                Las tarjetas de restaurantes
                se generan desde main.js
            -->

            <div id="restaurantes" class="publico-grid">
            </div>

        </section>

    </main>


    <!-- ==========================================
         JAVASCRIPT
    =========================================== -->

    <script src="main.js"></script>

</body>

</html>
