<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registrar restaurante</title>

    <link rel="stylesheet" href="main.css">
</head>

<body class="pagina-login">

    <main class="login-contenedor">

        <section class="login-tarjeta registro-tarjeta">

            <h1>Registrar restaurante</h1>

            <p class="login-descripcion">
                Creá una cuenta para administrar tu restaurante
                y mantener actualizada la disponibilidad de tus mesas.
            </p>

            <form id="form-registro">

                <!-- NOMBRE DEL RESTAURANTE -->
                <div class="campo">
                    <label for="nombre">
                        Nombre del restaurante
                    </label>

                    <input type="text" id="nombre" placeholder="Ej: La Estación" required>
                </div>

                <!-- DIRECCIÓN -->
                <div class="campo">
                    <label for="direccion">
                        Dirección
                    </label>

                    <input type="text" id="direccion" placeholder="Ej: San Martín 250" required>
                </div>

                <!-- CIUDAD -->
                <div class="campo">
                    <label for="ciudad">
                        Ciudad
                    </label>

                    <input type="text" id="ciudad" placeholder="Ej: Crespo" required>
                </div>

                <!-- TELÉFONO -->
                <div class="campo">
                    <label for="telefono">
                        Teléfono
                    </label>

                    <input type="tel" id="telefono" placeholder="Ej: 343 4567890" required>
                </div>

                <!-- DESCRIPCIÓN -->
                <div class="campo">
                    <label for="descripcion">
                        Descripción
                    </label>

                    <textarea id="descripcion" placeholder="Ej: Restaurante familiar" rows="3"></textarea>
                </div>

                <!-- CORREO -->
                <div class="campo">
                    <label for="email">
                        Correo electrónico
                    </label>

                    <input type="email" id="email" placeholder="restaurante@correo.com" required>
                </div>

                <!-- CONTRASEÑA -->
                <div class="campo">
                    <label for="password">
                        Contraseña
                    </label>

                    <input type="password" id="password" placeholder="Ingresá una contraseña" minlength="6" required>
                </div>

                <!-- REPETIR CONTRASEÑA -->
                <div class="campo">
                    <label for="repetir-password">
                        Repetir contraseña
                    </label>

                    <input type="password" id="repetir-password" placeholder="Repetí la contraseña" minlength="6"
                        required>
                </div>

                <button type="submit" class="btn-ingresar">
                    Registrar restaurante
                </button>

            </form>

            <div class="registro-restaurante">

                <p>¿Ya tenés una cuenta?</p>

                <a href="login.html">
                    Ingresar
                </a>

            </div>

            <a href="index.html" class="volver">
                ← Volver a restaurantes
            </a>

        </section>

    </main>

    <script src="auth.js"></script>

</body>

</html>
