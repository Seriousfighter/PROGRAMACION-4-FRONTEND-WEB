<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ingreso para restaurantes</title>

    <link rel="stylesheet" href="main.css">
</head>

<body class="pagina-login">

    <main class="login-contenedor">

        <section class="login-tarjeta">

            <h1>Ingreso para restaurantes</h1>

            <p class="login-descripcion">
                Administrá tu restaurante y actualizá rápidamente
                la disponibilidad de tus mesas.
            </p>

            <form id="form-login">

                <div class="campo">
                    <label for="email">Correo electrónico</label>

                    <input type="email" id="email" placeholder="restaurante@correo.com" required>
                </div>

                <div class="campo">
                    <label for="password">Contraseña</label>

                    <input type="password" id="password" placeholder="Ingresá tu contraseña" required>
                </div>

                <button type="submit" class="btn-ingresar">
                    Ingresar
                </button>

            </form>

            <div class="registro-restaurante">

                <p>¿Tu restaurante todavía no está registrado?</p>

                <a href="registro.html">
                    Registrar restaurante
                </a>

            </div>

            <a href="index.html" class="volver">
                ← Volver a restaurantes
            </a>

        </section>

    </main>

    <script src="auth.js"></script>
</body>

</html>
