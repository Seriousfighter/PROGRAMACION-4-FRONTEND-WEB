<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrativo - Messapi</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Messapi</h1>
        <div style="display: flex; align-items: center; gap: 15px;">
            <span id="mensaje-bienvenida" style="font-weight: bold;"></span>
            <button id="btn-logout" class="oculto">Cerrar Sesión</button>
        </div>
    </header>

    <main class="contenedor">
        
        <!-- VISTA PÚBLICA (Catálogo CSS Interactivos) -->
        <section id="vista-publica" class="tarjeta">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 style="margin: 0; border: none; border-bottom: 3px solid #e60000; padding-bottom: 5px;">Disponibilidad de Mesas</h2>
                <button id="btn-cargar-restaurantes">Actualizar Catálogo</button>
            </div>
            
            <div id="contenedor-restaurantes" class="contenedor-restaurantes"></div>
        </section>

        <!-- Vista de Login -->
        <section id="vista-login" class="tarjeta">
            <h2>Acceso Administrativo</h2>
            <form id="form-login">
                <div class="grupo-input">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" value="admin@test.com" required>
                </div>
                <div class="grupo-input">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" value="123456" required>
                </div>
                <button type="submit" class="btn-rojo">Ingresar</button>
                <p id="msj-error" class="msj-error"></p>
            </form>
        </section>

        <!-- Vista del Dashboard (Privada) -->
        <section id="vista-dashboard" class="oculto tarjeta">
            <h2>Panel de Gestión</h2>
            <div style="margin-top: 20px; border: 2px dashed #000; padding: 20px;">
                <h3>Rotar Estado de Mesa</h3>
                <button id="btn-rotar-mesa" class="btn-rojo">Rotar Mesa #1</button>
                <pre id="res-mesas" class="consola" style="margin-top: 15px;"></pre>
            </div>
        </section>
        
    </main>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
